name: Refresh Project Metrics

on:
  schedule:
    # Checks every hour; a per-day random plan decides which hours actually commit.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether to run this hour
        id: plan
        run: |
          python3 - <<'EOF'
          import os, random
          from datetime import datetime, timezone

          now = datetime.now(timezone.utc)
          # Same seed for the whole day -> every hourly run agrees on the plan.
          rng = random.Random(f"payguard-{now:%Y-%m-%d}")
          # Commits per day: 1-6, mostly 2-5.
          count = rng.choices([1, 2, 3, 4, 5, 6], weights=[1, 3, 3, 3, 3, 1])[0]
          # Only during IST daytime/evening (09:30-00:30 IST = 04-18 UTC).
          hours = sorted(rng.sample(range(4, 19), count))

          manual = os.environ.get("EVENT") == "workflow_dispatch"
          run = manual or now.hour in hours
          print(f"Today's plan: {count} commits at UTC hours {hours}; now={now.hour}; run={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"run={'true' if run else 'false'}\n")
          EOF
        env:
          EVENT: ${{ github.event_name }}

      - name: Checkout repository
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.plan.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate project metrics
        if: steps.plan.outputs.run == 'true'
        run: python scripts/update_project_metrics.py

      - name: Commit updated metrics
        if: steps.plan.outputs.run == 'true'
        run: |
          git config user.name "shatwiks"
          git config user.email "shatwik.mitblr2024@learner.manipal.edu"
          git add docs/PROJECT_METRICS.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          MESSAGES=(
            "docs: refresh project metrics"
            "docs(metrics): update codebase statistics"
            "docs: update test and API surface summary"
            "docs(metrics): sync language breakdown and line counts"
            "docs: regenerate project metrics report"
            "docs(metrics): refresh test case and route counts"
          )
          MSG="${MESSAGES[$((RANDOM % ${#MESSAGES[@]}))]}"
          git commit -m "$MSG [skip ci]"
          git push origin main
