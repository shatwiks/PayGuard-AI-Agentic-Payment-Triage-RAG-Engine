services:
  db:
    image: pgvector/pgvector:pg16
    container_name: payguard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payguard_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-payguard_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payguard_user} -d ${POSTGRES_DB:-payguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
