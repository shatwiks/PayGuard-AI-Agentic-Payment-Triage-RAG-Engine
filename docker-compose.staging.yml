services:
  db:
    image: pgvector/pgvector:pg16
    container_name: payguard_staging_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-payguard_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payguard_staging_secure_password_98234}
      POSTGRES_DB: ${POSTGRES_DB:-payguard_staging_db}
    ports:
      # Expose only on loopback interface to prevent public exposure
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - payguard_staging_pgdata:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-payguard_staging_user} -d ${POSTGRES_DB:-payguard_staging_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payguard_staging_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: payguard_staging_backend
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DEBUG: "false"
      POSTGRES_USER: ${POSTGRES_USER:-payguard_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-payguard_staging_secure_password_98234}
      POSTGRES_DB: ${POSTGRES_DB:-payguard_staging_db}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-payguard_staging_user}:${POSTGRES_PASSWORD:-payguard_staging_secure_password_98234}@db:5432/${POSTGRES_DB:-payguard_staging_db}
      SECRET_KEY: ${SECRET_KEY:-staging_payguard_secret_key_random_32_bytes_ok_9837}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RATE_LIMIT_ENABLED: "true"
      MASK_PII_ENABLED: "true"
      PROMPT_INJECTION_DEFENSE_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - payguard_staging_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: payguard_staging_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - payguard_staging_net

volumes:
  payguard_staging_pgdata:
    name: payguard_staging_pgdata
    driver: local

networks:
  payguard_staging_net:
    name: payguard_staging_net
    driver: bridge
